<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page_title }}</title>
    <meta name="description" content="Technical articles about coding, mathematics, and software craft.">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/toolbar/prism-toolbar.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/copy-to-clipboard/prism-copy-to-clipboard.min.css">
    <link rel="stylesheet" href="{{ base_path }}assets/css/style.css">
    <script>
      (function () {
        var stored = localStorage.getItem("blog-theme");
        var preferred = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-bs-theme", stored || preferred);
      })();
      window.Prism = window.Prism || {};
      window.Prism.manual = true;
    </script>
  </head>
  <body>
    <header class="site-header border-bottom">
      <nav class="navbar navbar-expand-lg">
        <div class="container py-2">
          <a class="navbar-brand site-wordmark" href="{{ base_path }}index.html">
            <i class="bi bi-journal-code" aria-hidden="true"></i>
            <span>{{ site_title }}</span>
          </a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#siteNav" aria-controls="siteNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="siteNav">
            <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
              <li class="nav-item"><a class="nav-link" href="{{ base_path }}index.html">Home</a></li>
              {% for page in pages %}
              <li class="nav-item"><a class="nav-link" href="{{ base_path }}{{ page.url }}">{{ page.title }}</a></li>
              {% endfor %}
              <li class="nav-item nav-search-item">
                <form class="nav-search" action="{{ base_path }}search/index.html" method="get" role="search">
                  <label class="visually-hidden" for="siteSearchInput">Search articles</label>
                  <input class="form-control form-control-sm nav-search-input" id="siteSearchInput" type="search" name="q" placeholder="Search" autocomplete="off">
                  <button class="btn btn-sm nav-search-button" type="submit" aria-label="Search articles" title="Search articles">
                    <i class="bi bi-search" aria-hidden="true"></i>
                  </button>
                </form>
              </li>
              <li class="nav-item">
                <button class="btn btn-sm theme-toggle" type="button" data-theme-toggle aria-label="Toggle color theme" title="Toggle color theme">
                  <span data-theme-icon>&#9680;</span>
                </button>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main class="site-main">
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer border-top">
      <div class="container d-flex justify-content-center text-center gap-2 py-4">
        <span>&copy; {{ year }} {{ author }}. All rights reserved.</span>
      </div>
    </footer>

    <button class="back-to-top" type="button" data-back-to-top aria-label="Back to top" title="Back to top">&uarr;</button>

    <script>
      window.MathJax = {
        tex: {
          inlineMath: [["$", "$"], ["\\(", "\\)"]],
          displayMath: [["$$", "$$"], ["\\[", "\\]"]]
        }
      };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-clike.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-c.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-makefile.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/toolbar/prism-toolbar.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/copy-to-clipboard/prism-copy-to-clipboard.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
    <script defer src="{{ base_path }}assets/js/main.js"></script>
  </body>
</html>
