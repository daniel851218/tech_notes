{% extends "base.html" %}

{% block content %}
<section class="page-band">
  <div class="container narrow-page">
    <header class="article-header">
      <p class="eyebrow mb-2">Information</p>
      <h1>{{ page.title }}</h1>
      {% if page.summary %}<p class="lead-copy">{{ page.summary }}</p>{% endif %}
    </header>

    <div class="prose">
      {{ page.html | safe }}
    </div>
  </div>
</section>
{% endblock %}
